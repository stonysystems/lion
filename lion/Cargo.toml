[package]
name = "lion"
version = "0.1.0"
edition = "2021"
authors = ["Lion Team"]
description = "Lion async runtime backed by formally verified components (lion-executor + lion-reactor)"
license = "MIT"

[dependencies]
lion-executor = { path = "../lion-executor", package = "lion-executor", default-features = false }
lion-reactor = { path = "../lion-reactor", package = "lion-reactor", default-features = false }
lion-utility-verified = { path = "../lion-utility", package = "lion-utility", default-features = false }
lion-macro = { path = "../lion-macro" }
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt"] }

[features]
# Lion's default OS backend (mio), forwarded to every runtime crate.
default = ["mio"]
mio = ["lion-executor/mio", "lion-reactor/mio", "lion-utility-verified/mio"]
