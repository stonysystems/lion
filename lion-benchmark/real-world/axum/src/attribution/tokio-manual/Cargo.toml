[package]
name = "tokio-manual-fileserver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axum-fileserver"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
