[package]
name = "lion-utility"
version = "0.1.0"
edition = "2021"
authors = ["Lion Team"]
description = "Formally verified Lion async utilities (verified kernel + thin glue)"
license = "MIT"

[dependencies]
vstd = { git = "https://github.com/verus-lang/verus", rev = "db81a74" }
lion-utility-spec = { path = "lion-utility-spec", package = "lion-utility-spec" }
lion-framework-spec = { path = "../lion-framework-spec", package = "lion-framework-spec" }
# Only this crate's `mio` feature turns on the runtime's mio backend (the
# sockets below always use mio for their syscalls, whatever backend polls them).
lion-reactor = { path = "../lion-reactor", package = "lion-reactor", default-features = false }
lion-executor = { path = "../lion-executor", package = "lion-executor", default-features = false }
mio = { version = "1.0", features = ["os-poll", "net"] }
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", default-features = false, features = ["io-util"] }

[features]
default = ["mio"]
mio = ["lion-reactor/mio", "lion-executor/mio"]

[dev-dependencies]
# The in-process mock OS backend (lion_reactor::os::mock) for backend tests.
lion-reactor = { path = "../lion-reactor", package = "lion-reactor", default-features = false, features = ["test-backend"] }
# mio::unix::pipe for the AsyncFd tests.
mio = { version = "1.0", features = ["os-ext"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(verus_keep_ghost)"] }

[package.metadata.verus]
verify = true

[package.metadata.verus.ide]
extra_args = "--crate-type=lib --expand-errors"
